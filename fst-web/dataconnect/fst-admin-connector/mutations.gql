  $decidedAt: Timestamp!
  $revision: Int!
  $idempotencyKey: String!
) @auth(level: NO_ACCESS) @transaction {
  qcLotDecision_insert(data: {
    id: $id
    storeId: $storeId
    lotId: $lotId
    lotRevision: $lotRevision
    decisionVersion: $decisionVersion
    status: $status
    passportAttachmentId: $passportAttachmentId
    protocolAttachmentId: $protocolAttachmentId
    targetFinishedProductId: $targetFinishedProductId
    reason: $reason
    decidedByUid: $decidedByUid
