  fstPrincipalAccesses(
    where: {
      firebaseUid: { eq: $firebaseUid }
      storeId: { eq: $storeId }
    }
    limit: 1
  ) {
    id
    firebaseUid
    storeId
    roleId
    capabilitiesJson
    active
    revision
    updatedAt
    revokedAt
    revokeReason
