    lotId
    lotRevision
    decisionVersion
    status
    passportAttachmentId
    protocolAttachmentId
    targetFinishedProductId
    reason
    decidedByUid
    decidedAt
    revision
    idempotencyKey
    createdAt
    updatedAt
  }
}

query GetLatestQcLotDecision($storeId: String!, $lotId: String!)
  @auth(level: NO_ACCESS) {
  qcLotDecisions(
    where: { storeId: { eq: $storeId }, lotId: { eq: $lotId } }
    orderBy: [{ decisionVersion: DESC }]
    limit: 1
  ) {
    id
    storeId
    lotId
    lotRevision
    decisionVersion
    status
    passportAttachmentId
    protocolAttachmentId
    targetFinishedProductId
    reason
    decidedByUid
    decidedAt
    revision
    idempotencyKey
  }
}

