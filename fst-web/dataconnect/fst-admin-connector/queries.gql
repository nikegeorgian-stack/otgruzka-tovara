# PHASE P1C.3 — admin-only QC reads (NO_ACCESS = Admin SDK only)

query GetQcPermissionByUidStore($firebaseUid: String!, $storeId: String!)
  @auth(level: NO_ACCESS) {
  qcPermissions(
    where: {
      firebaseUid: { eq: $firebaseUid }
      storeId: { eq: $storeId }
      active: { eq: true }
    }
    limit: 1
  ) {
    id
    firebaseUid
    storeId
    active
    canView
    canUpload
    canRelease
    canRegrade
    canReject
    canPostShipment
    revision
    createdAt
    createdByUid
    updatedAt
    updatedByUid
    revokedAt
    revokedByUid
    revokeReason
  }
}

query GetQcPermissionById($id: String!) @auth(level: NO_ACCESS) {
  qcPermission(id: $id) {
    id
    firebaseUid
    storeId
    active
    canView
    canUpload
    canRelease
    canRegrade
    canReject
    canPostShipment
    revision
    createdAt
    createdByUid
    updatedAt
    updatedByUid
    revokedAt
    revokedByUid
    revokeReason
  }
}

query ListQcPermissionsForStore($storeId: String!, $limit: Int!)
  @auth(level: NO_ACCESS) {
  qcPermissions(
    where: { storeId: { eq: $storeId } }
    orderBy: [{ updatedAt: DESC }]
    limit: $limit
  ) {
    id
    firebaseUid
    storeId
    active
    canView
    canUpload
    canRelease
    canRegrade
    canReject
    canPostShipment
    revision
    updatedAt
    revokedAt
    revokeReason
  }
}

query GetQcAttachmentRecord($id: String!) @auth(level: NO_ACCESS) {
  qcAttachmentRecord(id: $id) {
    id
    storeId
