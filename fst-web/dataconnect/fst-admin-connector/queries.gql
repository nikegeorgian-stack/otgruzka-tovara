}

query GetQcAttachmentByIdempotency($idempotencyKey: String!)
  @auth(level: NO_ACCESS) {
  qcAttachmentRecords(
    where: { idempotencyKey: { eq: $idempotencyKey } }
    limit: 1
  ) {
    id
    storeId
    lotId
    documentKind
    storagePath
    contentType
    sizeBytes
    checksum
    objectGeneration
    status
    uploadedByUid
    verifiedAt
    revision
    idempotencyKey
  }
}

query ListVerifiedLotAttachments($storeId: String!, $lotId: String!)
  @auth(level: NO_ACCESS) {
  qcAttachmentRecords(
    where: {
      storeId: { eq: $storeId }
      lotId: { eq: $lotId }
      status: { eq: "verified" }
    }
    limit: 50
  ) {
    id
    documentKind
    storagePath
    contentType
    sizeBytes
    checksum
    objectGeneration
    status
    revision
  }
}

query GetQcLotDecision($id: String!) @auth(level: NO_ACCESS) {
  qcLotDecision(id: $id) {
